services:
  todoapp:
    build:
      context: .
      dockerfile: cmd/todoapp/Dockerfile
    depends_on:
      todoapp-postgres-migrate:
        condition: service_completed_successfully
    environment:
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT:-30s}
      - POSTGRES_HOST=todoapp-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT:-5s}
      - LOGGER_LEVEL=${LOGGER_LEVEL:-info}
      - LOGGER_FOLDER=/app/out/logs
      - TIME_ZONE=${TIME_ZONE:-UTC}
    volumes:
      - ./out/logs:/app/out/logs
    ports:
      - "${HTTP_PORT:-5050}:5050"
    restart: always

  todoapp-postgres:
    image: postgres:18.6-bookworm
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: always

  todoapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      todoapp-postgres:
        condition: service_healthy
    command:
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@todoapp-postgres:5432/${POSTGRES_DB}?sslmode=disable&search_path=public
      - up
    volumes:
      - ./migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.1.3
    profiles: [tools]
    depends_on:
      todoapp-postgres:
        condition: service_healthy
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:todoapp-postgres:5432
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  swagger:
    profiles: [tools]
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.26-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    volumes:
      - .:/code
