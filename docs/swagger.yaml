      summary: Получить задачу
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: Частично обновить данные задачи по ID
      parameters:
      - description: ID задачи
        example: 1
        in: path
        name: id
        required: true
        type: integer
      - description: PatchTask тело запроса
        in: body
        name: request
        required: true
        schema:
