      summary: Удалить задачу
      tags:
      - tasks
    get:
      description: Получить информацию о задаче по ее ID
      parameters:
      - description: ID задачи
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Информация о задаче
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.GetTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_Tutiu-Maksim_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "404":
