paths:
  /statistics:
    get:
      description: Получить статистику по задачам пользователя за указанный временной
        период
      parameters:
      - description: ID пользователя
        example: 10
        in: query
        name: user_id
        type: integer
      - description: Дата начала периода (формат YYYY-MM-DD)
        example: "2026-01-01"
        in: query
        name: from
        type: string
      - description: Дата окончания периода (формат YYYY-MM-DD)
        example: "2026-12-31"
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Статистика по задачам
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_Tutiu-Maksim_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Tutiu-Maksim_golang-todoapp_internal_core_transport_http_response.ErrorResponse'
      summary: Получить статистику
      tags:
      - statistics
  /tasks:
    get:
      description: Получить список задач с фильтрацией по пользователю и пагинацией
      parameters:
      - description: ID автора задачи
        example: 10
        in: query
        name: user_id
        type: integer
      - description: Лимит количества записей
        example: 10
        in: query
        name: limit
        type: integer
      - description: Смещение списка записей
        example: 0
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Список задач
          schema:
            items:
              $ref: '#/definitions/internal_features_tasks_transport_http.TaskDTOResponse'
            type: array
        "400":
